<svg xmlns="http://www.w3.org/2000/svg"
     width="1180"
     height="610"
     viewBox="0 0 1180 610"
     font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace"
     role="img"
     aria-label="Aditya — profile.sh --live">

  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED">
        <animate attributeName="stop-color"
                 values="#7C3AED;#22D3EE;#10B981;#7C3AED"
                 dur="10s"
                 repeatCount="indefinite"/>
      </stop>

      <stop offset="0.5" stop-color="#22D3EE">
        <animate attributeName="stop-color"
                 values="#22D3EE;#10B981;#7C3AED;#22D3EE"
                 dur="10s"
                 repeatCount="indefinite"/>
      </stop>

      <stop offset="1" stop-color="#10B981">
        <animate attributeName="stop-color"
                 values="#10B981;#7C3AED;#22D3EE;#10B981"
                 dur="10s"
                 repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A101F"/>
      <stop offset="1" stop-color="#0C1426"/>
    </linearGradient>

    <filter id="glow8" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <filter id="glow3" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <filter id="txtGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.9" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="winClip">
      <rect x="2" y="2" width="1176" height="606" rx="18"/>
    </clipPath>

    <clipPath id="portraitClip">
      <rect x="38" y="86" width="396" height="488" rx="8"/>
    </clipPath>
  </defs>


  <!-- Main Window -->
  <rect x="2"
        y="2"
        width="1176"
        height="606"
        rx="18"
        fill="#070B16"/>

  <g clip-path="url(#winClip)">

    <rect x="2"
          y="2"
          width="1176"
          height="606"
          fill="url(#panelGrad)"/>


    <!-- Top Bar -->
    <rect x="2"
          y="2"
          width="1176"
          height="46"
          fill="#0B1222"/>

    <line x1="2"
          y1="48"
          x2="1178"
          y2="48"
          stroke="rgba(255,255,255,0.10)"/>

    <circle cx="30" cy="25" r="5.5" fill="#ff5f56"/>
    <circle cx="50" cy="25" r="5.5" fill="#ffbd2e"/>
    <circle cx="70" cy="25" r="5.5" fill="#27c93f"/>


    <!-- profile.sh --live -->
    <!-- EMAIL REMOVED -->
    <text x="590"
          y="29"
          text-anchor="middle"
          font-size="12"
          fill="#94A3B8">
      % ./profile.sh --live
    </text>


    <!-- Left Panel -->
    <text x="38"
          y="74"
          font-size="10"
          letter-spacing="3"
          fill="#475569">
      VISUAL.MAP
    </text>

    <rect x="36"
          y="84"
          width="400"
          height="492"
          rx="10"
          fill="none"
          stroke="#22D3EE"
          stroke-width="2"
          opacity="0.45"
          filter="url(#glow3)"/>

    <rect x="36"
          y="84"
          width="400"
          height="492"
          rx="10"
          fill="#0A101F"
          stroke="rgba(34,211,238,0.35)"/>


    <!-- Portrait -->
    <g clip-path="url(#portraitClip)">
      <!-- Keep your original image here -->
      <image x="38"
             y="86"
             width="396"
             height="488"
             preserveAspectRatio="xMidYMid slice"
             href="YOUR_BASE64_IMAGE_DATA_HERE"/>
    </g>


    <!-- Corner Decoration -->
    <path d="M 422 576 L 436 576 L 436 562"
          fill="none"
          stroke="#22D3EE"
          stroke-width="2"
          opacity="0.8"/>


    <!-- System Info -->
    <text x="470"
          y="106"
          font-size="13"
          letter-spacing="2"
          fill="#22D3EE"
          filter="url(#txtGlow)">
      SYSTEM.INFO
    </text>

    <line x1="566"
          y1="102"
          x2="1061"
          y2="102"
          stroke="rgba(255,255,255,0.10)"/>

    <text x="1125"
          y="106"
          text-anchor="end"
          font-size="12"
          fill="#F87171"
          font-weight="700">
      <tspan>&#9679;</tspan>
      LIVE
    </text>


    <!-- Role -->
    <text x="470" y="162"
          font-size="14"
          textLength="655"
          lengthAdjust="spacingAndGlyphs">
      <tspan fill="#22D3EE">Role </tspan>
      <tspan fill="rgba(148,163,184,0.35)">
        ........................................
      </tspan>
      <tspan fill="#F8FAFC" font-weight="600">
        AI/ML Engineer, Computer Vision
      </tspan>
    </text>


    <!-- Organization -->
    <text x="470" y="185"
          font-size="14"
          textLength="655"
          lengthAdjust="spacingAndGlyphs">
      <tspan fill="#22D3EE">Org </tspan>
      <tspan fill="rgba(148,163,184,0.35)">
        .........................................
      </tspan>
      <tspan fill="#F8FAFC" font-weight="600">
        DRDO (Project Engineer)
      </tspan>
    </text>


    <!-- Focus -->
    <text x="470" y="208"
          font-size="14"
          textLength="655"
          lengthAdjust="spacingAndGlyphs">
      <tspan fill="#22D3EE">Focus </tspan>
      <tspan fill="rgba(148,163,184,0.35)">
        .......................................
      </tspan>
      <tspan fill="#F8FAFC" font-weight="600">
        Real-time detection, medical imaging
      </tspan>
    </text>


    <!-- Languages -->
    <text x="470" y="231"
          font-size="14"
          textLength="655"
          lengthAdjust="spacingAndGlyphs">
      <tspan fill="#22D3EE">Languages </tspan>
      <tspan fill="rgba(148,163,184,0.35)">
        ...................................
      </tspan>
      <tspan fill="#F8FAFC" font-weight="600">
        Python, C++, MATLAB
      </tspan>
    </text>


    <!-- AI/ML -->
    <text x="470" y="254"
          font-size="14"
          textLength="655"
          lengthAdjust="spacingAndGlyphs">
      <tspan fill="#22D3EE">AI/ML </tspan>
      <tspan fill="rgba(148,163,184,0.35)">
        .......................................
      </tspan>
      <tspan fill="#F8FAFC" font-weight="600">
        TensorFlow, PyTorch, Keras, scikit-learn
      </tspan>
    </text>


    <!-- Vision -->
    <text x="470" y="277"
          font-size="14"
          textLength="655"
          lengthAdjust="spacingAndGlyphs">
      <tspan fill="#22D3EE">Vision </tspan>
      <tspan fill="rgba(148,163,184,0.35)">
        ......................................
      </tspan>
      <tspan fill="#F8FAFC" font-weight="600">
        OpenCV, CLAHE, Segmentation, Edge Detect
      </tspan>
    </text>


    <!-- Deployment -->
    <text x="470" y="300"
          font-size="14"
          textLength="655"
          lengthAdjust="spacingAndGlyphs">
      <tspan fill="#22D3EE">Deploy </tspan>
      <tspan fill="rgba(148,163,184,0.35)">
        ......................................
      </tspan>
      <tspan fill="#F8FAFC" font-weight="600">
        ONNX, C++ Inference, Benchmarking
      </tspan>
    </text>


    <!-- Hardware -->
    <text x="470" y="323"
          font-size="14"
          textLength="655"
          lengthAdjust="spacingAndGlyphs">
      <tspan fill="#22D3EE">Hardware </tspan>
      <tspan fill="rgba(148,163,184,0.35)">
        ....................................
      </tspan>
      <tspan fill="#F8FAFC" font-weight="600">
        Jetson Nano, CUDA
      </tspan>
    </text>


    <!-- Contact Divider - KEPT -->
    <text x="470"
          y="354"
          font-size="14"
          textLength="655"
          lengthAdjust="spacingAndGlyphs">
      <tspan fill="#475569">
        - Contact
      </tspan>
      <tspan fill="rgba(148,163,184,0.25)">
        ------------------------------------------------------------------------
      </tspan>
    </text>


    <!-- EMAIL ROW REMOVED -->


    <!-- LinkedIn -->
    <text x="470"
          y="400"
          font-size="14"
          textLength="655"
          lengthAdjust="spacingAndGlyphs">
      <tspan fill="#22D3EE">LinkedIn </tspan>
      <tspan fill="rgba(148,163,184,0.35)">
        ....................................
      </tspan>
      <tspan fill="#F8FAFC" font-weight="600">
        sushant-kumar-287901246
      </tspan>
    </text>


    <!-- Instagram REMOVED -->


    <!-- GitHub -->
    <!-- Kept 23px below LinkedIn -->
    <text x="470"
          y="423"
          font-size="14"
          textLength="655"
          lengthAdjust="spacingAndGlyphs">
      <tspan fill="#22D3EE">GitHub </tspan>
      <tspan fill="rgba(148,163,184,0.35)">
        ......................................
      </tspan>
      <tspan fill="#F8FAFC" font-weight="600">
        sushant9663
      </tspan>
    </text>


    <!-- README line REMOVED -->

  </g>


  <!-- Outer Border -->
  <rect x="3"
        y="3"
        width="1174"
        height="604"
        rx="17"
        fill="none"
        stroke="url(#accent)"
        stroke-width="3"
        opacity="0.55"
        filter="url(#glow8)"/>

  <rect x="3"
        y="3"
        width="1174"
        height="604"
        rx="17"
        fill="none"
        stroke="url(#accent)"
        stroke-width="1.6"/>

</svg>
